<!doctype html>
<html lang="$lang" data-assets="$assets" data-home="$home" data-sprites="$sprites" data-sprites-alt="$sprites_alt" data-sprites-ext="$sprites_ext" data-page="$page_id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="theme-color" content="#eef4ff">
$theme_init
<title>$title</title>
<meta name="description" content="$description">
$social
$analytics
<link rel="icon" href="${assets}mark.svg" type="image/svg+xml">
<link rel="icon" href="${assets}favicon.ico" sizes="16x16 32x32">
<link rel="apple-touch-icon" href="${assets}apple-touch-icon.png">
$alternates
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="${assets}style.css?v=$asset_v">
$extra_head
</head>
<body>
<a class="skip" href="#main">$skip</a>
<header class="top">
  <div class="wrap">
    <a class="brand" href="${home}index.html"><img class="brand-mark" src="${assets}mark.svg" width="30" height="30" alt="" decoding="async"><span><b>Survivor</b>Tiers</span></a>
    <nav class="nav" aria-label="$nav_aria">
$nav
    </nav>
    <div class="tools">$switch$theme$follow</div>
  </div>
</header>
<main id="main"><div class="wrap">
$content
</div></main>
<script src="${assets}app.js?v=$asset_v" defer></script>
</body>
</html>
