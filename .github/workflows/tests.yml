name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulator/sim-rs
      - name: cargo test
        working-directory: simulator/sim-rs
        run: cargo test --release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulator/sim-rs
      - name: build Rust simulator
        run: cargo build --release --manifest-path simulator/sim-rs/Cargo.toml --bin pokesim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: attack tier list matches the committed phase 1 output
        run: python3 build/attack_tiers.py --check
      - name: bond tier list matches the committed phase 2 output
        run: python3 build/bond_tiers.py --check
      - name: species builds and ranking match the committed phase 3 output
        run: python3 build/species_builds.py --check
      - name: the why model matches the committed fit
        run: python3 build/why.py --check
      - name: unit tests (the ones that read site/ render it first)
        run: python3 -m unittest discover -s build -p "test_*.py"
      - name: serve the rendered site and check it
        run: |
          export SPRITE_BASE=http://127.0.0.1:8765/_sprites/
          python3 build/catalog.py
          python3 build/render.py
          python3 build/serve.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          python3 build/check_site.py http://127.0.0.1:8765/
